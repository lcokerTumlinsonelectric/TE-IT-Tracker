<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TE IT Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 13px; }
.header { background: #1a1a2e; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.header h1 { font-size: 16px; font-weight: 700; }
.sync { font-size: 11px; color: #94a3b8; }
.summary { display: flex; gap: 10px; padding: 14px 20px 0; flex-wrap: wrap; }
.tile { background: white; border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 110px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
.tile .n { font-size: 28px; font-weight: 800; line-height: 1; }
.tile .l { font-size: 11px; color: #888; margin-top: 3px; }
.warn { margin: 12px 20px 0; background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #856404; line-height: 1.5; }
.warn strong { display: block; margin-bottom: 3px; }
.tabs { display: flex; gap: 8px; padding: 14px 20px 0; flex-wrap: wrap; }
.tab { padding: 7px 18px; border-radius: 20px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
.tab.active { background: #1a1a2e; color: white; }
.tab:not(.active) { background: white; color: #555; border: 1px solid #ddd; }
.tab-badge { display: inline-block; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; color: white; }
.content { padding: 12px 20px 80px; }
.section { display: none; }
.section.active { display: block; }
.card { background: white; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid #ccc; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.card.open     { border-left-color: #e74c3c; }
.card.inprog   { border-left-color: #f39c12; }
.card.closed   { border-left-color: #95a5a6; opacity: .7; }
.card.ordered  { border-left-color: #2980b9; }
.card.received { border-left-color: #27ae60; }
.card.needs    { border-left-color: #e74c3c; }
.card-hdr  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
.card-name { font-weight: 700; color: #1a1a2e; line-height: 1.3; }
.card-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.card-desc { color: #444; font-size: 12px; margin-bottom: 7px; line-height: 1.55; }
.card-meta { color: #aaa; font-size: 11px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.email-btn { font-size: 11px; color: #0077cc; text-decoration: none; padding: 2px 8px; border: 1px solid #d6eaf8; border-radius: 6px; background: #f0f7ff; white-space: nowrap; }
.email-btn:hover { background: #d6eaf8; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 12px; white-space: nowrap; }
.pill-open     { background: #fde8e8; color: #c0392b; }
.pill-prog     { background: #fef3cd; color: #b7770d; }
.pill-closed   { background: #eaecee; color: #666; }
.pill-ordered  { background: #d6eaf8; color: #1a5276; }
.pill-received { background: #d5f5e3; color: #1e8449; }
.pill-needs    { background: #fde8e8; color: #c0392b; }
.new-badge { background: #27ae60; color: white; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; font-weight: 700; }
.attacker  { font-family: monospace; font-size: 11px; color: #e74c3c; background: #fde8e8; padding: 2px 6px; border-radius: 4px; }
.id-tag    { font-family: monospace; font-size: 11px; color: #bbb; }
.eq-chip   { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 8px; background: #f0f2f5; color: #555; border: 1px solid #ddd; }
.empty     { text-align: center; padding: 40px 20px; color: #bbb; font-size: 13px; }
.status-btn { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 3px 8px; font-size: 11px; color: #555; cursor: pointer; }
.smenu-wrap { position: relative; display: inline-block; }
.smenu { display: none; position: absolute; right: 0; top: calc(100% + 4px); background: white; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 50; min-width: 160px; overflow: hidden; }
.smenu.open { display: block; }
.smenu-item { padding: 9px 14px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.smenu-item:hover { background: #f5f6f7; }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.note { margin: 10px 20px 0; font-size: 11px; color: #999; }
#lockscreen { position: fixed; inset: 0; background: #1a1a2e; z-index: 9999; display: flex; align-items: center; justify-content: center; }
.lock-box { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 340px; margin: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.3); text-align: center; }
.lock-box input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 10px; font-family: inherit; }
.lock-box button { width: 100%; padding: 10px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div id="lockscreen">
  <div class="lock-box">
    <div style="font-size:32px;margin-bottom:12px">&#x1F5A5;&#xFE0F;</div>
    <h2 style="font-size:16px;font-weight:700;margin-bottom:4px">Tumlinson Electric</h2>
    <p style="font-size:12px;color:#888;margin-bottom:20px">IT Tracker &mdash; Authorized Access Only</p>
    <input id="pw-input" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">Sign In</button>
    <p id="pw-error" style="color:#e74c3c;font-size:12px;margin-top:10px;display:none;">Incorrect password.</p>
  </div>
</div>

<div class="header">
  <h1>&#x1F5A5;&#xFE0F; Tumlinson Electric &mdash; IT Tracker</h1>
  <span class="sync" id="sync-time">Loading...</span>
</div>

<div class="summary" id="summary"></div>
<div id="warn-banner"></div>

<div class="tabs">
  <button class="tab active" data-tab="it" onclick="switchTab('it')">IT Issues <span class="tab-badge" id="badge-it" style="background:#e74c3c"></span></button>
  <button class="tab"        data-tab="eq" onclick="switchTab('eq')">Equipment Orders <span class="tab-badge" id="badge-eq" style="background:#8e44ad"></span></button>
  <button class="tab"        data-tab="sw" onclick="switchTab('sw')">Software <span class="tab-badge" id="badge-sw" style="background:#16a085"></span></button>
  <button class="tab"        data-tab="ph" onclick="switchTab('ph')">Phishing Alerts <span class="tab-badge" id="badge-ph" style="background:#2980b9"></span></button>
</div>

<div class="note">&#x1F504; Data updates automatically when Logan runs an email scan in Claude. Refresh this page to see the latest. Status changes you make here are saved on this device.</div>

<div class="content">
  <div class="section active" id="sec-it"></div>
  <div class="section"        id="sec-eq"></div>
  <div class="section"        id="sec-sw"></div>
  <div class="section"        id="sec-ph"></div>
</div>

<script>
// ── Password gate ─────────────────────────────────────────────────────────────
(function(){ if(sessionStorage.getItem('te_auth')==='true'){ document.getElementById('lockscreen').style.display='none'; } })();
function checkPw(){
  if(document.getElementById('pw-input').value === 'Suncrestmanor2020?'){
    sessionStorage.setItem('te_auth','true');
    document.getElementById('lockscreen').style.display='none';
  } else {
    document.getElementById('pw-error').style.display='block';
    document.getElementById('pw-input').value='';
  }
}

// ── Status configs ────────────────────────────────────────────────────────────
var IT_S = [{l:'Open',p:'pill-open',d:'#e74c3c',c:'open'},{l:'In Progress',p:'pill-prog',d:'#f39c12',c:'inprog'},{l:'Closed',p:'pill-closed',d:'#95a5a6',c:'closed'}];
var PH_S = [{l:'Open',p:'pill-open',d:'#e74c3c',c:'open'},{l:'Resolved',p:'pill-closed',d:'#95a5a6',c:'closed'}];
var EQ_S = [{l:'Needs Ordering',p:'pill-needs',d:'#e74c3c',c:'needs'},{l:'Ordered',p:'pill-ordered',d:'#2980b9',c:'ordered'},{l:'Received',p:'pill-received',d:'#27ae60',c:'received'}];
var SW_S = [{l:'Quoted',p:'pill-needs',d:'#e74c3c',c:'needs'},{l:'Ordered',p:'pill-ordered',d:'#2980b9',c:'ordered'},{l:'Active',p:'pill-received',d:'#27ae60',c:'received'}];
var EQ_IC = {Laptop:'\uD83D\uDCBB','Screen Extender':'\uD83D\uDDA5\uFE0F',iPad:'\uD83D\uDCF1',Monitor:'\uD83D\uDDB5','Keyboard / Mouse':'\u2328\uFE0F','Docking Station':'\uD83D\uDD0C',Phone:'\uD83D\uDCDE',Other:'\uD83D\uDCE6'};

var itIssues=[], equipment=[], phishing=[], software=[], lastUpdated='';
var overrides = JSON.parse(localStorage.getItem('te_status_overrides')||'{}');
var seenIds   = JSON.parse(localStorage.getItem('te_seen_ids')||'[]');

// ── Load live data from data.json (same repo, updated by Claude) ──────────────
async function loadData(){
  try {
    var r = await fetch('data.json?cb=' + Date.now()); // cache-bust
    var d = await r.json();
    itIssues  = d.it || [];
    equipment = d.equipment || [];
    phishing  = d.phishing || [];
    software  = d.software || [];
    lastUpdated = d.lastUpdated || '';
    // Apply local status overrides
    [itIssues, equipment, phishing, software].forEach(function(arr){
      arr.forEach(function(item){ if(overrides[item.id]) item.status = overrides[item.id]; });
    });
    document.getElementById('sync-time').textContent = 'Data updated: ' + (lastUpdated ? new Date(lastUpdated).toLocaleString() : 'unknown');
    render();
    // Mark all current ids as seen after render
    var allIds = itIssues.concat(equipment, phishing).map(function(x){return x.id;});
    localStorage.setItem('te_seen_ids', JSON.stringify(allIds));
  } catch(e){
    document.getElementById('sync-time').textContent = 'Failed to load data';
    document.getElementById('sec-it').innerHTML = '<div class="empty">Could not load data.json — '+e.message+'</div>';
  }
}

function isNew(id){ return seenIds.length > 0 && seenIds.indexOf(id) < 0; }

// ── Helpers ───────────────────────────────────────────────────────────────────
function getCfg(type,label){var l=type==='it'?IT_S:type==='ph'?PH_S:type==='sw'?SW_S:EQ_S;return l.find(function(s){return s.l===label;})||l[0];}
function getCfgList(type){return type==='it'?IT_S:type==='ph'?PH_S:type==='sw'?SW_S:EQ_S;}

function statusMenuHTML(type,id,current){
  var items=getCfgList(type).map(function(s){
    return '<div class="smenu-item" onclick="changeStatus(\''+type+'\',\''+id+'\',\''+s.l+'\');event.stopPropagation()"><span class="sdot" style="background:'+s.d+'"></span>'+s.l+(s.l===current?' \u2713':'')+'</div>';
  }).join('');
  return '<div class="smenu-wrap"><button class="status-btn" onclick="toggleMenu(\'sm-'+id+'\');event.stopPropagation()">\u270E Status</button><div class="smenu" id="sm-'+id+'">'+items+'</div></div>';
}

function changeStatus(type,id,newStatus){
  var arr=type==='it'?itIssues:type==='ph'?phishing:type==='sw'?software:equipment;
  var item=arr.find(function(e){return e.id===id;});
  if(item){ item.status=newStatus; overrides[id]=newStatus; localStorage.setItem('te_status_overrides', JSON.stringify(overrides)); }
  closeMenus(); render();
}

function toggleMenu(id){closeMenus();var m=document.getElementById(id);if(m)m.classList.toggle('open');}
function closeMenus(){document.querySelectorAll('.smenu.open').forEach(function(m){m.classList.remove('open');});}
document.addEventListener('click',closeMenus);

function makeCard(type,item,cfg,metaHtml,bodyText){
  var emailBtn = item.threadUrl
    ? '<a class="email-btn" href="'+item.threadUrl+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">\uD83D\uDD17 Open in Outlook</a>'
    : '';
  return '<div class="card '+cfg.c+'">'
    +'<div class="card-hdr"><span class="card-name">'+item.name+(isNew(item.id)?'<span class="new-badge">NEW</span>':'')+'</span>'
    +'<div class="card-right"><span class="pill '+cfg.p+'">'+cfg.l+'</span>'+statusMenuHTML(type,item.id,cfg.l)+'</div></div>'
    +'<div class="card-desc">'+(bodyText||'\u2014')+'</div>'
    +'<div class="card-meta">'+metaHtml+'<span class="id-tag">'+item.id+'</span>'+(emailBtn?'<span style="margin-left:auto">'+emailBtn+'</span>':'')+'</div>'
    +'</div>';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  var openIt=itIssues.filter(function(i){return i.status==='Open';}).length;
  var progIt=itIssues.filter(function(i){return i.status==='In Progress';}).length;
  var openPh=phishing.filter(function(p){return p.status==='Open';}).length;
  var pendEq=equipment.filter(function(e){return e.status!=='Received';}).length;

  document.getElementById('summary').innerHTML=[
    {n:itIssues.length,l:'IT Issues',c:'#1a1a2e'},
    {n:openIt+progIt,l:'Active Issues',c:'#e74c3c'},
    {n:equipment.length,l:'Equipment Orders',c:'#8e44ad'},
    {n:software.length,l:'Software',c:'#16a085'},
    {n:phishing.length,l:'Phishing Alerts',c:'#2980b9'}
  ].map(function(t){return'<div class="tile"><div class="n" style="color:'+t.c+'">'+t.n+'</div><div class="l">'+t.l+'</div></div>';}).join('');

  document.getElementById('badge-it').textContent=openIt+progIt;
  document.getElementById('badge-eq').textContent=pendEq;
  document.getElementById('badge-sw').textContent=software.filter(function(s){return s.status!=='Active';}).length;
  document.getElementById('badge-ph').textContent=openPh;

  document.getElementById('warn-banner').innerHTML = openPh > 0
    ?'<div class="warn"><strong>\u26A0\uFE0F Active Phishing Alerts</strong>'+openPh+' open phishing alerts targeting TE employees. All intercepted by Barracuda. See Phishing Alerts tab.</div>':'';

  document.getElementById('sec-it').innerHTML=itIssues.length?itIssues.slice().reverse().map(function(i){
    var cfg=getCfg('it',i.status);
    return makeCard('it',i,cfg,'<span>\uD83D\uDCC5 '+i.date+'</span>',i.description);
  }).join(''):'<div class="empty">No IT issues on record.</div>';

  document.getElementById('sec-eq').innerHTML=equipment.length?equipment.slice().reverse().map(function(e){
    var cfg=getCfg('eq',e.status);
    var disp=Object.assign({},e,{name:(EQ_IC[e.eqType]||'\uD83D\uDCE6')+' '+e.eqType+(e.assignedTo?' \u2014 '+e.assignedTo:'')});
    var meta='<span><span class="eq-chip">'+e.eqType+'</span></span>'+(e.assignedTo?'<span>\uD83D\uDC64 '+e.assignedTo+'</span>':'')+'<span>\uD83D\uDCC5 '+e.date+'</span>';
    return makeCard('eq',disp,cfg,meta,[e.description,e.notes].filter(Boolean).join(' \u2014 '));
  }).join(''):'<div class="empty">No equipment orders.</div>';

  document.getElementById('sec-sw').innerHTML=software.length?software.slice().reverse().map(function(s){
    var cfg=getCfg('sw',s.status);
    var disp=Object.assign({},s,{name:'\uD83D\uDCC4 '+s.software+(s.assignedTo?' \u2014 '+s.assignedTo:'')});
    var meta=(s.assignedTo?'<span>\uD83D\uDC64 '+s.assignedTo+'</span>':'')+'<span>\uD83D\uDCC5 '+s.date+'</span>';
    return makeCard('sw',disp,cfg,meta,[s.description,s.notes].filter(Boolean).join(' \u2014 '));
  }).join(''):'<div class="empty">No software orders.</div>';

  document.getElementById('sec-ph').innerHTML=phishing.length?phishing.slice().reverse().map(function(p){
    var cfg=getCfg('ph',p.status);
    var meta='<span>\uD83C\uDFA3 <span class="attacker">'+p.attackerEmail+'</span></span><span>\uD83D\uDCC5 '+p.date+'</span>';
    return makeCard('ph',p,cfg,meta,p.issue);
  }).join(''):'<div class="empty">No phishing alerts.</div>';
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});
  ['it','eq','sw','ph'].forEach(function(t){document.getElementById('sec-'+t).classList.toggle('active',t===tab);});
}

loadData();
</script>
</body>
</html>
