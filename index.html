  .tab:not(.active) { background: white; color: #555; border: 1px solid #ddd; }
  .tab-badge { display: inline-block; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; color: white; }

  .content { padding: 12px 20px 80px; }
  .section { display: none; }
  .section.active { display: block; }

  .card { background: white; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid #ccc; box-shadow: 0 1px 3px rgba(0,0,0,.07); }

  .card.inprog   { border-left-color: #f39c12; }
  .card.closed   { border-left-color: #95a5a6; opacity: .7; }
  .card.ordered  { border-left-color: #2980b9; }
  .card.received { border-left-color: #27ae60; }
  .card.needs    { border-left-color: #e74c3c; }

  .card-hdr  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
  .card-name { font-weight: 700; color: #1a1a2e; line-height: 1.3; transition: color .15s; }
  .card-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .card-desc { color: #444; font-size: 12px; margin-bottom: 7px; line-height: 1.55; }
  .card-meta { color: #aaa; font-size: 11px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }


  .pill { font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 12px; white-space: nowrap; flex-shrink: 0; }
  .pill-open     { background: #fde8e8; color: #c0392b; }
  .pill-prog     { background: #fef3cd; color: #b7770d; }
  .pill-closed   { background: #eaecee; color: #666; }
  .pill-ordered  { background: #d6eaf8; color: #1a5276; }
  .pill-received { background: #d5f5e3; color: #1e8449; }
  .pill-needs    { background: #fde8e8; color: #c0392b; }

  .new-badge { background: #27ae60; color: white; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; font-weight: 700; }
  .attacker  { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; color: #e74c3c; background: #fde8e8; padding: 2px 6px; border-radius: 4px; }

  .eq-chip   { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 8px; background: #f0f2f5; color: #555; border: 1px solid #ddd; }

  .smenu-wrap { position: relative; display: inline-block; }
  .smenu { display: none; position: absolute; right: 0; top: calc(100% + 4px); background: white; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 50; min-width: 160px; overflow: hidden; }

<div id="lockscreen" style="position:fixed;inset:0;background:#1a1a2e;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:16px;padding:32px;width:100%;max-width:340px;margin:16px;box-shadow:0 8px 32px rgba(0,0,0,.3);text-align:center;">

    <p style="font-size:12px;color:#888;margin-bottom:20px">IT Tracker &mdash; Authorized Access Only</p>
    <input id="pw-input" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkPw()"
      style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;margin-bottom:10px;font-family:inherit;">
    <button onclick="checkPw()"
      style="width:100%;padding:10px;background:#1a1a2e;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">
      Sign In
    </button>
    <p id="pw-error" style="color:#e74c3c;font-size:12px;margin-top:10px;display:none;">Incorrect password. Try again.</p>
  </div>
</div>

<script>
(function(){
  // Check if already authenticated this session
  if(sessionStorage.getItem('te_auth')==='true'){
    document.getElementById('lockscreen').style.display='none';
  }
})();

function checkPw(){
  var pw = document.getElementById('pw-input').value;
  // Password: TE2026! (change this to whatever you want)
  if(pw === 'TE2026!'){
    sessionStorage.setItem('te_auth','true');
    document.getElementById('lockscreen').style.display='none';
  } else {
    document.getElementById('pw-error').style.display='block';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
}
</script>

// ── Storage (localStorage — works on all devices from GitHub Pages) ────────────
function load(key){try{var v=localStorage.getItem(key);return v?JSON.parse(v):[];}catch(e){return[];}}
function save(key,data){try{localStorage.setItem(key,JSON.stringify(data));}catch(e){}}

var itIssues=load('te_it'), equipment=load('te_equipment'), phishing=load('te_phishing');
var newItIds=[], newEqIds=[], newPhIds=[];

function seedList(arr,seed,matchFn,newIds){
  seed.forEach(function(item){
    var rec=arr.find(function(e){return matchFn(e,item);});
    if(!rec){arr.push(item);newIds.push(item.id);}
    else if(!rec.threadUrl&&item.threadUrl){rec.threadUrl=item.threadUrl;}
  });
}
seedList(itIssues,SEED_IT,function(e,i){return e.id===i.id||e.name===i.name;},newItIds);
seedList(equipment,SEED_EQ,function(e,i){return e.id===i.id||(e.assignedTo===i.assignedTo&&e.eqType===i.eqType&&e.date===i.date);},newEqIds);
seedList(phishing,SEED_PH,function(e,i){return e.id===i.id||(e.name===i.name&&e.attackerEmail===i.attackerEmail&&e.date===i.date);},newPhIds);
save('te_it',itIssues);save('te_equipment',equipment);save('te_phishing',phishing);

// ── Helpers ───────────────────────────────────────────────────────────────────
function getCfg(type,label){var l=type==='it'?IT_S:type==='ph'?PH_S:EQ_S;return l.find(function(s){return s.l===label;})||l[0];}
function getCfgList(type){return type==='it'?IT_S:type==='ph'?PH_S:EQ_S;}

function statusMenuHTML(type,id,current){
  var items=getCfgList(type).map(function(s){
    return '<div class="smenu-item" onclick="changeStatus(\''+type+'\',\''+id+'\',\''+s.l+'\');event.stopPropagation()"><span class="sdot" style="background:'+s.d+'"></span>'+s.l+(s.l===current?' &#x2713;':'')+'</div>';
  }).join('');
  return '<div class="smenu-wrap"><button class="status-btn" onclick="toggleMenu(\'sm-'+id+'\');event.stopPropagation()">&#x270E; Status</button><div class="smenu" id="sm-'+id+'">'+items+'</div></div>';
}

function changeStatus(type,id,newStatus){
  var arr=type==='it'?itIssues:type==='ph'?phishing:equipment;
  var key=type==='it'?'te_it':type==='ph'?'te_phishing':'te_equipment';
  var item=arr.find(function(e){return e.id===id;});
  if(item){item.status=newStatus;save(key,arr);}
  closeMenus();render();
}

function toggleMenu(id){closeMenus();var m=document.getElementById(id);if(m)m.classList.toggle('open');}
function closeMenus(){document.querySelectorAll('.smenu.open').forEach(function(m){m.classList.remove('open');});}
document.addEventListener('click',closeMenus);

function makeCard(type,item,isNew,cfg,metaHtml,bodyText){
  var emailBtn=item.threadUrl
    ?'<a href="'+item.threadUrl+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#0077cc;text-decoration:none;padding:3px 8px;border:1px solid #d6eaf8;border-radius:6px;background:#f0f7ff;">&#x1F517; Open in Outlook</a>'
    :'';
  return '<div class="card '+cfg.c+'">'
    +'<div class="card-hdr"><span class="card-name">'+item.name+(isNew?'<span class="new-badge">NEW</span>':'')+'</span>'
    +'<div class="card-right"><span class="pill '+cfg.p+'">'+cfg.l+'</span>'+statusMenuHTML(type,item.id,cfg.l)+'</div></div>'
    +'<div class="card-desc">'+(bodyText||'&mdash;')+'</div>'
    +'<div class="card-meta">'+metaHtml+'<span class="id-tag">'+item.id+'</span>'+(emailBtn?'<span style="margin-left:auto">'+emailBtn+'</span>':'')+'</div>'
    +'</div>';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('sync-time').textContent='Last updated: '+new Date().toLocaleString();
  var openIt=itIssues.filter(function(i){return i.status==='Open';}).length;
  var progIt=itIssues.filter(function(i){return i.status==='In Progress';}).length;
  var openPh=phishing.filter(function(p){return p.status==='Open';}).length;
  var pendEq=equipment.filter(function(e){return e.status!=='Received';}).length;

  document.getElementById('summary').innerHTML=[
    {n:itIssues.length,l:'IT Issues',c:'#1a1a2e'},
    {n:openIt+progIt,l:'Active Issues',c:'#e74c3c'},
    {n:equipment.length,l:'Equipment Orders',c:'#8e44ad'},
    {n:phishing.length,l:'Phishing Alerts',c:'#2980b9'}
  ].map(function(t){return'<div class="tile"><div class="n" style="color:'+t.c+'">'+t.n+'</div><div class="l">'+t.l+'</div></div>';}).join('');

  document.getElementById('badge-it').textContent=openIt+progIt;
  document.getElementById('badge-eq').textContent=pendEq;
  document.getElementById('badge-ph').textContent=openPh;

  document.getElementById('warn-banner').innerHTML=phishing.some(function(p){return p.status==='Open'&&['lonelyextrovert23@gmail.com','john@baseandboardteams.com','john.boss@baseboardus.com'].indexOf(p.attackerEmail)>=0;})
    ?'<div class="warn"><strong>&#x26A0;&#xFE0F; Active Phishing Campaign</strong>Multiple campaigns targeting TE employees intercepted by Barracuda. See Phishing Alerts tab for details.</div>':'';

  document.getElementById('sec-it').innerHTML=itIssues.length?itIssues.slice().reverse().map(function(i){
    var cfg=getCfg('it',i.status);
    return makeCard('it',i,newItIds.indexOf(i.id)>-1,cfg,'<span>&#128197; '+i.date+'</span>',i.description);
  }).join(''):'<div class="empty">No IT issues on record.</div>';

  document.getElementById('sec-eq').innerHTML=equipment.length?equipment.slice().reverse().map(function(e){
    var cfg=getCfg('eq',e.status);
    var disp=Object.assign({},e,{name:(EQ_IC[e.eqType]||'&#x1F4E6;')+' '+e.eqType+(e.assignedTo?' &mdash; '+e.assignedTo:'')});
    var meta='<span><span class="eq-chip">'+e.eqType+'</span></span>'+(e.assignedTo?'<span>&#128100; '+e.assignedTo+'</span>':'')+'<span>&#128197; '+e.date+'</span>';
    return makeCard('eq',disp,newEqIds.indexOf(e.id)>-1,cfg,meta,[e.description,e.notes].filter(Boolean).join(' &mdash; '));
  }).join(''):'<div class="empty">No equipment orders yet.<br>Click <strong>+ Add Equipment Order</strong> to get started.</div>';

  document.getElementById('sec-ph').innerHTML=phishing.length?phishing.slice().reverse().map(function(p){
    var cfg=getCfg('ph',p.status);
    var meta='<span>&#127907; <span class="attacker">'+p.attackerEmail+'</span></span><span>&#128197; '+p.date+'</span>';
    return makeCard('ph',p,newPhIds.indexOf(p.id)>-1,cfg,meta,p.issue);
  }).join(''):'<div class="empty">No phishing alerts on record.</div>';
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});
  ['it','eq','ph'].forEach(function(t){document.getElementById('sec-'+t).classList.toggle('active',t===tab);});
  document.getElementById('fab').style.display=tab==='eq'?'block':'none';
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(){document.getElementById('f-date').value=new Date().toISOString().split('T')[0];document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');['f-name','f-desc','f-notes'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('f-type').selectedIndex=0;document.getElementById('f-status').selectedIndex=0;}
function addEquipment(){
  var item={id:'EQ'+String(Date.now()).slice(-6),assignedTo:document.getElementById('f-name').value.trim(),eqType:document.getElementById('f-type').value,description:document.getElementById('f-desc').value.trim(),status:document.getElementById('f-status').value,date:document.getElementById('f-date').value||new Date().toISOString().split('T')[0],notes:document.getElementById('f-notes').value.trim()};
  equipment.push(item);save('te_equipment',equipment);closeModal();render();
}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

render();
</script>
