<title>TE IT Tracker</title>
<!--
  SYSTEM INSTRUCTIONS FOR AI ASSISTANT (Logan's IT Ops Assistant):
  At the start of EVERY conversation in this project, automatically:
  1. Scan Logan's Outlook inbox for the last 2 weeks (and any new since last scan)
  2. Identify IT issues, phishing alerts (extract attacker "From" email from body),
     and equipment-related emails (laptops, iPads, tablets, screens, monitors, etc.)
  3. Add new items to the appropriate tracker key without duplicates:
     - IT issues   → te_it       (id, name, description, date, status, threadUrl)
     - Phishing    → te_phishing (id, name, attackerEmail, issue, date, status, threadUrl)
     - Equipment   → te_equipment(id, assignedTo, eqType, description, status, date, notes, threadUrl)
  4. Report how many new items were added, then ask if anything else is needed.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 13px; }

  /* Header */
  .header { background: #1a1a2e; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
  .sync { font-size: 11px; color: #94a3b8; }

  /* Summary tiles */
  .summary { display: flex; gap: 10px; padding: 14px 20px 0; flex-wrap: wrap; }
  .tile { background: white; border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 110px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
  .tile .n { font-size: 28px; font-weight: 800; line-height: 1; }
  .tile .l { font-size: 11px; color: #888; margin-top: 3px; }

  /* Warning banner */
  .warn { margin: 12px 20px 0; background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #856404; line-height: 1.5; }
  .warn strong { display: block; margin-bottom: 3px; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; padding: 14px 20px 0; flex-wrap: wrap; }
  .tab { padding: 7px 18px; border-radius: 20px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .15s, color .15s; }
  .tab.active { background: #1a1a2e; color: white; }
  .tab:not(.active) { background: white; color: #555; border: 1px solid #ddd; }
  .tab-badge { display: inline-block; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; color: white; }

  /* Content */
  .content { padding: 12px 20px 80px; }
  .section { display: none; }
  .section.active { display: block; }

  /* Cards */
  .card { background: white; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid #ccc; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .card.open     { border-left-color: #e74c3c; }
  .card.inprog   { border-left-color: #f39c12; }
  .card.ordered  { border-left-color: #2980b9; }
  .card.received { border-left-color: #27ae60; }
  .card.needs    { border-left-color: #e74c3c; }
  .card.clickable { cursor: pointer; text-decoration: none; display: block; color: inherit; transition: box-shadow .15s, transform .1s; }
  .card.clickable:hover { box-shadow: 0 4px 14px rgba(0,0,0,.13); transform: translateY(-1px); }
  .card.clickable:hover .card-name { color: #0077cc; }
  .card-hdr  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
  .card-name { font-weight: 700; color: #1a1a2e; line-height: 1.3; transition: color .15s; }
  .card-desc { color: #444; font-size: 12px; margin-bottom: 7px; line-height: 1.55; }
  .card-meta { color: #aaa; font-size: 11px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .link-hint { font-size: 11px; color: #0077cc; margin-left: auto; opacity: 0; transition: opacity .15s; white-space: nowrap; }
  .card.clickable:hover .link-hint { opacity: 1; }

  /* Pills */
  .pill { font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 12px; white-space: nowrap; flex-shrink: 0; }
  .pill-open     { background: #fde8e8; color: #c0392b; }
  .pill-prog     { background: #fef3cd; color: #b7770d; }
  .pill-ordered  { background: #d6eaf8; color: #1a5276; }
  .pill-received { background: #d5f5e3; color: #1e8449; }
  .pill-needs    { background: #fde8e8; color: #c0392b; }

  .new-badge { background: #27ae60; color: white; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; font-weight: 700; }
  .attacker { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; color: #e74c3c; background: #fde8e8; padding: 2px 6px; border-radius: 4px; }
  .id-tag   { font-family: monospace; font-size: 11px; color: #bbb; }
  .eq-chip  { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 8px; background: #f0f2f5; color: #555; border: 1px solid #ddd; }
  .empty    { text-align: center; padding: 40px 20px; color: #bbb; font-size: 13px; }

  /* FAB */
  .fab { position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; color: white; border: none; border-radius: 50px; padding: 12px 20px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25); display: none; z-index: 100; }
  .fab:hover { background: #2d2d4e; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: white; border-radius: 14px; padding: 24px; width: 100%; max-width: 420px; margin: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
  .modal h2 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #1a1a2e; }
  .form-row textarea { resize: vertical; min-height: 60px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .btn { padding: 8px 18px; border-radius: 20px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #1a1a2e; color: white; }
  .btn-primary:hover { background: #2d2d4e; }
  .btn-cancel  { background: #f0f2f5; color: #555; }
  .btn-cancel:hover { background: #e2e5ea; }
</style>
</head>

</div>

<div id="warn-banner"></div>

<div class="tabs">

  <button class="tab"        data-tab="eq"  onclick="switchTab('eq')">Equipment Orders <span class="tab-badge" id="badge-eq" style="background:#8e44ad"></span></button>
  <button class="tab"        data-tab="ph"  onclick="switchTab('ph')">Phishing Alerts <span class="tab-badge" id="badge-ph" style="background:#2980b9"></span></button>
</div>

<div class="content">
  <div class="section active" id="sec-it"></div>
  <div class="section"        id="sec-eq"></div>
  <div class="section"        id="sec-ph"></div>
</div>

<button class="fab" id="fab" onclick="openModal()">&#xFF0B; Add Equipment Order</button>

<div class="overlay" id="overlay">

    <h2>&#x1F4E6; New Equipment Order</h2>
    <div class="form-row">
      <label>Assigned To</label>
      <input id="f-name" type="text" placeholder="Employee name">
    </div>
    <div class="form-row">
      <label>Equipment Type</label>
      <select id="f-type">
        <option value="Laptop">Laptop</option>
        <option value="Screen Extender">Screen Extender</option>
        <option value="iPad">iPad</option>
        <option value="Monitor">Monitor</option>
        <option value="Keyboard / Mouse">Keyboard / Mouse</option>
        <option value="Docking Station">Docking Station</option>
        <option value="Phone">Phone</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-row">
      <label>Description / Model</label>
      <textarea id="f-desc" placeholder="e.g. Lenovo ThinkPad E14, 16GB RAM"></textarea>
    </div>
    <div class="form-row">
      <label>Status</label>
      <select id="f-status">
        <option value="Needs Ordering">Needs Ordering</option>
        <option value="Ordered">Ordered</option>
        <option value="Received">Received</option>
      </select>
    </div>
    <div class="form-row">
      <label>Date</label>
      <input id="f-date" type="date">
    </div>
    <div class="form-row">
      <label>Notes (optional)</label>
      <textarea id="f-notes" placeholder="Order #, vendor, ETA, etc."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addEquipment()">Add Order</button>
    </div>
  </div>
</div>

// ── Storage ──────────────────────────────────────────────────────────────────
function load(key) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : []; } catch(e) { return []; }
}
function save(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
}

var phishing  = load('te_phishing');
var newItIds = [], newEqIds = [], newPhIds = [];

function seedList(existing, incoming, matchFn, newIds) {
  incoming.forEach(function(item) {
    var rec = existing.find(function(e) { return matchFn(e, item); });
    if (!rec) { existing.push(item); newIds.push(item.id); }
    else if (!rec.threadUrl && item.threadUrl) { rec.threadUrl = item.threadUrl; }
  });
}

}
function eqPillClass(s){
  if(s==='Ordered')  return 'pill-ordered';
  if(s==='Received') return 'pill-received';
  return 'pill-needs';
}

function makeCard(item, isNew, cardClass, pillClass, statusText, metaHtml) {
  var tag   = item.threadUrl ? 'a' : 'div';
  var attrs = item.threadUrl ? ' href="'+item.threadUrl+'" target="_blank" rel="noopener"' : '';
  var cls   = 'card '+cardClass+(item.threadUrl?' clickable':'');
  var hint  = item.threadUrl ? '<span class="link-hint">&#x1F517; Open in Outlook</span>' : '';
  return '<'+tag+attrs+' class="'+cls+'">' +
    '<div class="card-hdr"><span class="card-name">'+item.name+(isNew?'<span class="new-badge">NEW</span>':'')+
    '</span><span class="pill '+pillClass+'">'+statusText+'</span></div>'+
    '<div class="card-desc">'+(item.description||item.issue||item.notes||'&mdash;')+'</div>'+
    '<div class="card-meta">'+metaHtml+'<span class="id-tag">'+item.id+'</span>'+hint+'</div>'+
  '</'+tag+'>';
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('sync-time').textContent = 'Last synced: '+new Date().toLocaleString();

  var openIt  = itIssues.filter(function(i){ return i.status==='Open'; }).length;
  var progIt  = itIssues.filter(function(i){ return i.status==='In Progress'; }).length;
  var openPh  = phishing.filter(function(p){ return p.status==='Open'; }).length;
  var pendEq  = equipment.filter(function(e){ return e.status!=='Received'; }).length;

  document.getElementById('summary').innerHTML = [
    { n:itIssues.length,  l:'IT Issues',       c:'#1a1a2e' },
    { n:openIt+progIt,    l:'Active Issues',    c:'#e74c3c' },
    { n:equipment.length, l:'Equipment Orders', c:'#8e44ad' },
    { n:phishing.length,  l:'Phishing Alerts',  c:'#2980b9' }
  ].map(function(t){
    return '<div class="tile"><div class="n" style="color:'+t.c+'">'+t.n+'</div><div class="l">'+t.l+'</div></div>';
  }).join('');

  // Phishing warning if new alerts detected
  if(newPhIds.length>0){
    document.getElementById('warn-banner').innerHTML =
      '<div class="warn"><strong>&#x26A0;&#xFE0F; Active Phishing Campaign &mdash; Jun 10, 2026</strong>'+
      'Direct-deposit scam from <code>lonelyextrovert23@gmail.com</code> targeted 4 employees. '+
      '"John Boss" impersonation (<code>john@baseandboardteams.com</code>, <code>john.boss@baseboardus.com</code>) hit 3 more. '+
      'Separate attack on Kenneth Tumlinson from <code>greslobewigsu2n@hotmail.com</code>. All blocked by Barracuda.</div>';
  }

  document.getElementById('badge-it').textContent = openIt+progIt;
  document.getElementById('badge-eq').textContent = pendEq;
  document.getElementById('badge-ph').textContent = openPh;

  // IT Issues
  document.getElementById('sec-it').innerHTML = itIssues.slice().reverse().map(function(i){
    var sc = i.status==='Open'?'open':'inprog';
    var pc = i.status==='Open'?'pill-open':'pill-prog';
    return makeCard(i, newItIds.indexOf(i.id)>-1, sc, pc, i.status, '<span>&#128197; '+i.date+'</span>');
  }).join('') || '<div class="empty">No IT issues on record.</div>';

  // Equipment Orders
  document.getElementById('sec-eq').innerHTML = equipment.length
    ? equipment.slice().reverse().map(function(e){
        var display = Object.assign({}, e, {
          name: eqIcon(e.eqType)+' '+e.eqType+(e.assignedTo?' &mdash; '+e.assignedTo:''),
          description: e.description || e.notes || ''
        });
        var meta = '<span><span class="eq-chip">'+e.eqType+'</span></span>'+
                   (e.assignedTo?'<span>&#128100; '+e.assignedTo+'</span>':'')+
                   '<span>&#128197; '+e.date+'</span>';
        return makeCard(display, newEqIds.indexOf(e.id)>-1, eqCardClass(e.status), eqPillClass(e.status), e.status, meta);
      }).join('')
    : '<div class="empty">No equipment orders yet.<br>Click <strong>+ Add Equipment Order</strong> to get started.</div>';

  // Phishing
  document.getElementById('sec-ph').innerHTML = phishing.slice().reverse().map(function(p){
    var meta = '<span>&#127907; Attacker: <span class="attacker">'+p.attackerEmail+'</span></span><span>&#128197; '+p.date+'</span>';
    return makeCard(p, newPhIds.indexOf(p.id)>-1, 'open', 'pill-open', p.status, meta);
  }).join('') || '<div class="empty">No phishing alerts on record.</div>';
}

// ── Tab switching ────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
  ['it','eq','ph'].forEach(function(t){ document.getElementById('sec-'+t).classList.toggle('active', t===tab); });
  document.getElementById('fab').style.display = tab==='eq' ? 'block' : 'none';
}

// ── Modal ────────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  ['f-name','f-desc','f-notes'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('f-type').selectedIndex   = 0;
  document.getElementById('f-status').selectedIndex = 0;
}
function addEquipment() {
  var assignedTo = document.getElementById('f-name').value.trim();
  var eqType     = document.getElementById('f-type').value;
  var desc       = document.getElementById('f-desc').value.trim();
  var status     = document.getElementById('f-status').value;
  var date       = document.getElementById('f-date').value || new Date().toISOString().split('T')[0];
  var notes      = document.getElementById('f-notes').value.trim();
  if(!eqType){ alert('Please select an equipment type.'); return; }
  equipment.push({ id:'EQ'+String(Date.now()).slice(-6), assignedTo:assignedTo, eqType:eqType, description:desc, status:status, date:date, notes:notes });
  save('te_equipment', equipment);
  closeModal();
  render();
}

document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

render();
</script>
</body>
</html>
